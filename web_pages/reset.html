<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password · Finance+</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --green:#2E9E3F; --green-dark:#1F7A2E; --accent:#4CD137;
    --ink:#14241a; --muted:#6b7a70; --card:#ffffff; --line:#e4ece6; --err:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100svh; display:grid; place-items:center; padding:24px;
    font-family:"Outfit",sans-serif; color:var(--ink);
    background:
      radial-gradient(900px 600px at 15% -10%, rgba(76,209,55,.18), transparent 60%),
      radial-gradient(700px 500px at 110% 115%, rgba(46,158,63,.20), transparent 55%),
      #f4f8f5;
  }
  .card{
    width:min(440px,100%); background:var(--card); border:1px solid var(--line);
    border-radius:26px; padding:42px 34px 36px;
    box-shadow:0 30px 70px -30px rgba(31,122,46,.40);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .brand{display:flex;justify-content:center;align-items:center;gap:8px;font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;margin-bottom:28px}
  .brand .f{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:18px}
  .brand .plus{color:var(--green)}
  h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:26px;letter-spacing:-.4px;text-align:center;margin-bottom:8px}
  .sub{color:var(--muted);text-align:center;font-size:15px;margin-bottom:26px}
  label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:14px 0 6px}
  input{
    width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:13px;
    font-family:inherit;font-size:16px;color:var(--ink);background:#fbfdfb;outline:none;transition:.2s;
  }
  input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(46,158,63,.12)}
  button{
    width:100%;margin-top:24px;padding:15px;border:0;border-radius:26px;cursor:pointer;
    font-family:inherit;font-weight:600;font-size:16px;color:#fff;letter-spacing:.3px;
    background:linear-gradient(160deg,var(--accent),var(--green));
    box-shadow:0 14px 26px -12px rgba(46,158,63,.7);transition:.2s;
  }
  button:hover{filter:brightness(1.04)}
  button:disabled{opacity:.6;cursor:not-allowed;filter:none}
  .msg{margin-top:16px;font-size:14px;text-align:center;min-height:18px}
  .msg.error{color:var(--err)}
  .center-icon{width:84px;height:84px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--accent),var(--green));box-shadow:0 14px 30px -12px rgba(46,158,63,.6)}
  .center-icon svg{width:42px;height:42px;stroke:#fff;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .hidden{display:none}
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="f">F</span>Finance<span class="plus">+</span></div>

    <section id="form-view">
      <h1>Reset your password</h1>
      <p class="sub" id="form-sub">Enter a new password for your account.</p>
      <label for="pw1">New password</label>
      <input id="pw1" type="password" placeholder="At least 6 characters" autocomplete="new-password" />
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" placeholder="Re-enter password" autocomplete="new-password" />
      <button id="submit" disabled>Verifying link…</button>
      <div class="msg" id="msg"></div>
    </section>

    <section id="done-view" class="hidden">
      <div class="center-icon"><svg viewBox="0 0 52 52"><path d="M14 27 L23 36 L39 18"/></svg></div>
      <h1>Password updated!</h1>
      <p class="sub">You can close this tab and log in to Finance+ with your new password.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ====== FILL THESE IN (same values as your Flutter app's config) ======
    const SUPABASE_URL = "https://eltlsdwntacbeffofbor.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsdGxzZHdudGFjYmVmZm9mYm9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjMzMzEsImV4cCI6MjA5NTg5OTMzMX0.6sWEni8OcMzerdyJCaPC7a_I0A5yjaFNaXQO5s07kWE";
    // ======================================================================

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: false, persistSession: false }
    });

    const pw1 = document.getElementById("pw1");
    const pw2 = document.getElementById("pw2");
    const btn = document.getElementById("submit");
    const msg = document.getElementById("msg");
    let ready = false;

    function setMsg(t, type){ msg.textContent = t || ""; msg.className = "msg " + (type||""); }
    function enable(){ ready = true; btn.disabled = false; btn.textContent = "Update password"; setMsg(""); }
    function badLink(){
      btn.textContent = "Link invalid or expired"; btn.disabled = true;
      setMsg("Open the reset link from your email again (links expire after a while).", "error");
    }

    (async () => {
      try {
        const url = new URL(window.location.href);
        const qp = url.searchParams;
        const hash = new URLSearchParams(url.hash.replace(/^#/, ""));

        // 1) Stateless token_hash (the reliable path; set up in the email template)
        const tokenHash = qp.get("token_hash") || hash.get("token_hash");
        const type = qp.get("type") || hash.get("type") || "recovery";
        if (tokenHash) {
          const { error } = await client.auth.verifyOtp({ type, token_hash: tokenHash });
          return error ? badLink() : enable();
        }

        // 2) Implicit hash tokens (#access_token=...&type=recovery)
        const access = hash.get("access_token");
        const refresh = hash.get("refresh_token");
        if (access && refresh) {
          const { error } = await client.auth.setSession({ access_token: access, refresh_token: refresh });
          return error ? badLink() : enable();
        }

        // 3) PKCE ?code= (only if the same client requested it)
        if (qp.get("code")) {
          try {
            await client.auth.exchangeCodeForSession(window.location.href);
            const { data } = await client.auth.getSession();
            if (data && data.session) return enable();
          } catch (e) {}
        }
        badLink();
      } catch (e) { badLink(); }
    })();

    btn.addEventListener("click", async () => {
      if (!ready) return;
      const p1 = pw1.value, p2 = pw2.value;
      if (p1.length < 6) return setMsg("Password must be at least 6 characters.", "error");
      if (p1 !== p2) return setMsg("Passwords do not match.", "error");
      btn.disabled = true; btn.textContent = "Updating…"; setMsg("");
      const { error } = await client.auth.updateUser({ password: p1 });
      if (error) { btn.disabled = false; btn.textContent = "Update password"; return setMsg(error.message, "error"); }
      document.getElementById("form-view").classList.add("hidden");
      document.getElementById("done-view").classList.remove("hidden");
      await client.auth.signOut();
    });
  </script>
</body>
</html>
